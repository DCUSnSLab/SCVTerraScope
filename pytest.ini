[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Disable ROS 2 pytest plugins that auto-register from /opt/ros/humble on
# this dev machine. They pull in `lark` and other deps not in our venv and
# break collection. Listed by entry-point name (see `pytest11` group).
addopts = -ra -p no:launch_ros -p no:launch_testing
